[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qt-theme-studio"
version = "0.1.0"
description = "統合テーマエディターGUIアプリケーション"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Qt-Theme-Studio Team"}
]
keywords = ["qt", "theme", "gui", "editor", "pyside6", "pyqt6", "pyqt5"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Desktop Environment",
]
requires-python = ">=3.14.2"

# 依存関係の定義
dependencies = [
    # qt-theme-managerは必ずGitHubリポジトリから直接インストール
    "qt-theme-manager @ git+https://github.com/scottlz0310/Qt-Theme-Manager.git",
    # Qt フレームワーク（PySide6を推奨、PyQt6/PyQt5はフォールバック）
    "PySide6>=6.10.1",
    # 画像処理・プレビュー生成
    "Pillow>=12.1.0",
    # コンソール出力の色付け
    "colorama>=0.4.6",
]

# 依存関係グループの定義（PEP 735形式）
[dependency-groups]
dev = [
    # テスト関連
    "pytest>=9.0.2",
    "pytest-qt>=4.5.0",
    "pytest-cov>=7.0.0",
    "pytest-benchmark>=5.2.3",
    # コード品質
    "ruff>=0.14.10",  # 高速なPythonリンター・フォーマッター
    "basedpyright>=1.36.2",
    # セキュリティ
    "bandit>=1.9.2",
    "safety>=3.7.0",
    # Pre-commit
    "pre-commit>=4.5.1",
]
qt6 = [
    "PyQt6>=6.10.1",
]
qt5 = [
    "PyQt5>=5.15.11",
]

# エントリーポイントの定義
[project.scripts]
qt-theme-studio = "qt_theme_studio.main:main"

[project.gui-scripts]
qt-theme-studio-gui = "qt_theme_studio.main:main"

[project.urls]
Homepage = "https://github.com/your-org/qt-theme-studio"
Repository = "https://github.com/your-org/qt-theme-studio"
Issues = "https://github.com/your-org/qt-theme-studio/issues"
Documentation = "https://github.com/your-org/qt-theme-studio/docs"

# setuptools設定
[tool.setuptools]
packages = ["qt_theme_studio"]

[tool.setuptools.package-data]
qt_theme_studio = [
    "resources/icons/*",
    "resources/templates/*",
    "resources/styles/*",
]

# pytest設定
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config --ignore=archive --ignore=playground"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gui: marks tests as GUI tests requiring display",
]

# カバレッジ設定
[tool.coverage.run]
source = ["qt_theme_studio"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# ruff設定（高速なPythonリンター・フォーマッター）
[tool.ruff]
# ターゲットPythonバージョン
target-version = "py39"
# 行の最大長
line-length = 88
# インデント
indent-width = 4

# 除外するファイル・ディレクトリ
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "scripts",
    "tests",
    "typings",
    ".mypy_cache",
    ".pytest_cache",
    "*.egg-info",
    "htmlcov",
    ".coverage",
]

# リンター設定
[tool.ruff.lint]
# 有効にするルール
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "Q",   # flake8-quotes
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PIE", # flake8-pie
    "T20", # flake8-print
    "TCH", # flake8-type-checking
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SLOT", # flake8-slots
    "TID", # flake8-tidy-imports
    "LOG", # flake8-logging-format
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]

# 無効にするルール
ignore = [
    "E501",  # line too long (ruff formatで処理)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
    "E203",  # whitespace before ':'
]

# ファイル別の無視ルール
[tool.ruff.lint.per-file-ignores]
"qt_theme_studio/logger.py" = [
    "N802",  # Function name should be lowercase (継承元のdoRollover)
    "N803",  # Argument name should be lowercase (継承元のmaxBytes, backupCount)
]
"qt_theme_studio/adapters/qt_adapter.py" = [
    "N806",  # Variable name should be lowercase (Qtモジュール名の統一性のため)
]
"qt_theme_studio/cli.py" = [
    "T201",  # print found (CLI出力のため必要)
]
"main.py" = [
    "T201",  # print found (メインエントリーポイントのため必要)
    "PTH110", "PTH123", "SIM115",  # パス操作とファイル操作
]
"qt_theme_studio/main.py" = [
    "T201",  # print found (エントリーポイントラッパーのため必要)
]

# インポート整理設定
[tool.ruff.lint.isort]
known-first-party = ["qt_theme_studio"]
known-third-party = ["PySide6", "PyQt6", "PyQt5", "PIL", "colorama"]
force-single-line = false
combine-as-imports = true

# フォーマット設定
[tool.ruff.format]
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
